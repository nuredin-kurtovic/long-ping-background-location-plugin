name: long_ping
description: "Background location on a fixed clock: any interval from 1 second, a native upload queue that survives app kills and reboots. iOS and Android."
version: 1.1.0
homepage: https://longping.dev
repository: https://github.com/nuredin-kurtovic/long-ping-background-location-plugin/tree/main/flutter
issue_tracker: https://github.com/nuredin-kurtovic/long-ping-background-location-plugin/issues
topics:
  - location
  - geolocation
  - gps
  - background-location
  - tracking

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.longping.flutter
        pluginClass: LongPingPlugin
      ios:
        pluginClass: LongPingPlugin
