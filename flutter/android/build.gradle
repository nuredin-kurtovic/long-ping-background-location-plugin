// Long Ping for Flutter: the same Android engine as react-native-long-ping (com.longping.core / .engine,
// copied in by tools/sync-flutter.sh) behind a Flutter plugin class (com.longping.flutter.LongPingPlugin).

group = "com.longping"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.longping"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
        // Keep rules for apps that shrink release builds with R8 (on by default for Flutter release builds).
        consumerProguardFiles "consumer-rules.pro"
    }

    dependencies {
        implementation "com.google.android.gms:play-services-location:21.3.0"
        implementation "androidx.work:work-runtime:2.10.5"
        implementation "androidx.core:core:1.13.1"
    }
}
