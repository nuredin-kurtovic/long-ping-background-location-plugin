name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also run by publish.yml before anything is published.
  workflow_call:

permissions:
  contents: read

jobs:
  android-core:
    name: Android core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon -p tools/android-core-tests test

  ios-core:
    name: iOS core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm pack --dry-run
