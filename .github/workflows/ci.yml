name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Also run by publish.yml before anything is published.
  workflow_call:

permissions:
  contents: read

jobs:
  android-core:
    name: Android core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon -p tools/android-core-tests test

  ios-core:
    name: iOS core tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios

  flutter:
    name: Flutter package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Engine copies match android/ and ios/
        run: tools/sync-flutter.sh --check
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: flutter
      - run: flutter analyze
        working-directory: flutter
      - run: flutter test
        working-directory: flutter
      - run: dart pub publish --dry-run
        working-directory: flutter
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android build of the example app
        run: flutter build apk --debug
        working-directory: flutter/example

  flutter-ios:
    name: Flutter iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: iOS simulator build of the example app
        run: flutter build ios --simulator --debug
        working-directory: flutter/example

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm pack --dry-run
      - name: iOS engine version matches package.json
        run: |
          pkg=$(node -p "require('./package.json').version")
          ios=$(sed -nE 's/.*static let version = "([^"]+)".*/\1/p' ios/Engine/EngineSupport.swift)
          if [ "$pkg" != "$ios" ]; then
            echo "package.json is $pkg but ios/Engine/EngineSupport.swift says $ios" >&2
            exit 1
          fi
